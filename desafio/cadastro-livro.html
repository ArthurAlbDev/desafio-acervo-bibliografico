<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Acervo Bibliográfico</title>
</head>
<body>

    <header>

        <h1>Cadastro de Referência Bibliográfica</h1>
        <p>Cadastre os livros recomendados para as disciplinas</p>

    </header>

    <main>
        <section>
            <h2>Cadastro de Livros</h2>

            <form action="/salvar-livro" method="post">

                <fieldset>

                    <legend>Informações da Obra</legend>

                    <p>
                        <label for="titulo">Titulo do Livro</label>
                        <input type="text" id="titulo" name="titulo" required>
                    </p>

                    <p>
                        <label for="autores">Autor(es):</label>
                        <input type="text" id="autores" name="autores" required>
                    </p>

                    <p>
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn" name="isbn" pattern="\d{13}" minlength="13" maxlength="13" placeholder="Digite os 13 digitos do ISBN" required>
                    </p>

                    <p>
                        <label for="ano">Ano de Publicação</label>
                        <input type="number" id="ano" name="ano" placeholder="Ex: 2025" required>
                    </p>

                </fieldset>

                <fieldset>

                    <legend>Detalhes Acadêmicos</legend>

                    <p>
                        <label for="curso">Curso Alvo</label>
                        <select id="curso" name="curso" required>
                            <option value="" selected disabled>Selecione o Curso...
                            </option>
                            <option value="engenharia-software">Engenharia de Software
                            </option>
                            <option value="ads">Análise e Desenvolvimento de Sistemas
                            </option>
                            <option value="tronco-comum">Tronco Comum
                            </option>
                        </select>
                    </p>

                    <p>
                        <label for="disciplina">Disciplina</label>
                        <input type="text" id="disciplina" name="disciplina" required>
                    </p>

                    <p>Formato do Material</p>

                    <p>
                        <input type="radio" id="fisico" name="formato" value="fisico" required>
                        <label for="fisico">Fisico</label>

                        <input type="radio" id="digital" name="formato" value="digital" required>
                        <label for="digital">Digital</label>

                        <input type="radio" id="hibrido" name="formato" value="hibrido" required>
                        <label for="hibrido">Hibrido</label>
                    </p>

                </fieldset>

                <button type="submit">Salvar Livro</button>

            </form>

        </section>
    </main>
    
</body>
</html>
